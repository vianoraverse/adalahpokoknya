<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-teks="judul.masuk">Masuk | YourWay</title>
    <script src="/js/awal.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="masuk">
      <div class="masuk__papan gelap">
        <div class="masuk__atas">
          <a class="logo" href="/"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
            <path d="M8 6l8 10v10M24 6l-8 10" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="24" cy="6" r="4.5" fill="#ffce2e" stroke="#14163f" stroke-width="2" />
          </svg> YourWay</a>
          <div data-tampilan></div>
        </div>
        <div>
          <p class="papan-teks" data-teks="auth.slogan">Setelah lulus, mau ke mana?</p>
          <p data-teks="auth.proyek">Project mata kuliah RPL, Kelompok 4.</p>
        </div>
      </div>
      <main class="masuk__isi">
        <h1 data-teks="masuk.judul">Masuk</h1>
        <p class="masuk__sub"><span data-teks="masuk.belum">Belum punya akun?</span> <a href="/daftar" data-bawa-lanjut data-teks="depan.daftar">Daftar</a></p>
        <form class="formulir" id="form-masuk">
          <label><span data-teks="auth.email">Email</span> <input name="email" type="email" autocomplete="email" required /></label>
          <label><span data-teks="auth.sandi">Kata sandi</span> <input name="password" type="password" autocomplete="current-password" required /></label>
          <p class="galat" role="alert" hidden></p>
          <button class="tombol tombol--utama" data-teks="masuk.tombol">Masuk</button>
        </form>
      </main>
    </div>
    <script type="module" src="/js/halaman/masuk.js"></script>
  </body>
</html>
