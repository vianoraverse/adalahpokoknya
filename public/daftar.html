<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar | YourWay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="masuk">
      <div class="masuk__papan gelap">
        <a class="logo" href="/"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
            <path d="M8 6l8 10v10M24 6l-8 10" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="24" cy="6" r="4.5" fill="#ffce2e" stroke="#14163f" stroke-width="2" />
          </svg> YourWay</a>
        <div>
          <p class="papan-teks">Setelah lulus, mau ke mana?</p>
          <p>Ukur niat kariermu dan lihat seberapa cocok soft skill-mu dengan karier TIK yang kamu tuju.</p>
        </div>
      </div>
      <main class="masuk__isi">
        <h1>Buat akun</h1>
        <p class="masuk__sub">Sudah punya akun? <a href="/masuk" data-bawa-lanjut>Masuk</a></p>
        <form class="formulir" id="form-daftar">
          <label>Nama <input name="nama" autocomplete="name" required minlength="2" maxlength="80" /></label>
          <label>Email <input name="email" type="email" autocomplete="email" required /></label>
          <label>
            Kata sandi
            <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72" aria-describedby="petunjuk-sandi" />
            <small id="petunjuk-sandi">Minimal 8 karakter.</small>
          </label>
          <label class="centang">
            <input name="setuju" type="checkbox" required />
            <span>
              Saya setuju YourWay menyimpan nama, email, dan jawaban kuesioner saya untuk menghitung hasil asesmen. Hasil hanya
              bisa saya lihat sendiri, dan saya bisa menghapus akun kapan saja.
            </span>
          </label>
          <p class="galat" role="alert" hidden></p>
          <button class="tombol tombol--utama">Buat akun</button>
        </form>
      </main>
    </div>
    <script type="module" src="/js/halaman/daftar.js"></script>
  </body>
</html>
