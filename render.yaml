# Blueprint Render: satu web service Node.js yang menyajikan API dan frontend.
# Basis data memakai PostgreSQL eksternal (mis. Neon) lewat DATABASE_URL,
# karena PostgreSQL gratis milik Render kedaluwarsa setelah 30 hari.
services:
  - type: web
    name: yourway
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@yourway.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: none
