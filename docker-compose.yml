# Menjalankan YourWay dengan PostgreSQL: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yourway
      POSTGRES_PASSWORD: yourway
      POSTGRES_DB: yourway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourway"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://yourway:yourway@db:5432/yourway
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-nilai-acak-yang-panjang}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yourway.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "4000:4000"

volumes:
  pgdata:
